name = "academy-web"
main = "worker/index.ts"
compatibility_date = "2026-11-01"

# 5-minute timer for the /status join counter (a Durable Object alarm: the free plan's 5 cron triggers are all used).
[[durable_objects.bindings]]
name = "CLOCK"
class_name = "StatusClock"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StatusClock"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true  # the Worker adds security headers and answers 404 for unknown paths (navigations would skip it otherwise)

[[routes]]
pattern = "academy.0xhieu.xyz"
custom_domain = true

# Secrets (wrangler secret put): RELAYER_KEY, TG_BOT_TOKEN, TG_CHAT_ID
# Deploy: npx vite build && npx wrangler deploy

[[kv_namespaces]]
binding = "GAS"
id = "85145b00fd1c450eacaf95f4b28c51bd"
