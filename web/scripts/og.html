<head>

<link rel="stylesheet" href="../src/ds/web.css" />
<style>

  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fff; color: #000; font-family: var(--ds-font-web); -webkit-font-smoothing: antialiased; }
  .card { height: 100%; padding: 0 48px 48px; display: flex; flex-direction: column; }

  .logo img { width: 32px; height: 32px; }
  .label { --s: var(--ds-type-swiss-label-size); --l: var(--ds-type-swiss-label-line); --w: var(--ds-type-swiss-label-weight); --k: var(--ds-type-swiss-label-tracking); text-transform: uppercase; }
  .statement { --s: var(--ds-type-swiss-statement-size); --l: var(--ds-type-swiss-statement-line); --w: var(--ds-type-swiss-statement-weight); --k: var(--ds-type-swiss-statement-tracking); margin: 0; }

  .side { width: 296px; display: flex; flex-direction: column; gap: 24px; }
  .seal { background: #F5B301; color: #000; padding: 8px 16px; width: max-content; }
